name: Aurora Manual Update

on:
  workflow_dispatch:
    inputs:
      concorso:
        description: 'Numero concorso (es. 124)'
        required: true
        type: string
      data:
        description: 'Data GG/MM/AAAA (es. 04/10/2026)'
        required: true
        type: string
      numeri:
        description: 'Otto numeri (virgole o spazi)'
        required: true
        type: string
      sestine:
        description: 'Sestine giocate (formato: 16,35,46,51,66,68 | 5,22,30,34,65,84) — opzionale'
        required: false
        default: ''
        type: string

permissions:
  contents: write

concurrency:
  group: aurora-write-${{ github.ref }}
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      MPLBACKEND: Agg
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      # Fix #3: input passati via env (no interpolazione diretta in shell)
      MANUAL_CONCORSO: ${{ github.event.inputs.concorso }}
      MANUAL_DATA: ${{ github.event.inputs.data }}
      MANUAL_NUMERI: ${{ github.event.inputs.numeri }}
      MANUAL_SESTINE: ${{ github.event.inputs.sestine }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install Dipendenze
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Aggiungi estrazione manuale (con validazione severa)
        run: python aurora_manual_update.py

      - name: Check post-estrazione
        run: python vinci_vita_check.py
        continue-on-error: true

      - name: Esecuzione Engine + Telegram
        run: python vinci_vita_telegram.py

      - name: Analisi pattern + Telegram
        run: python analyze_history.py
        continue-on-error: true

      - name: Salvataggio su GitHub
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          for file in vinci_history.json vinci_database.json \
                      vinci_played.json vinci_bankroll.json \
                      pattern_report.json; do
            if [ -f "$file" ]; then
              git add "$file"
            fi
          done

          if git diff --cached --quiet; then
            echo "Nessuna modifica."
          else
            git commit -m "Manual update + pattern analysis [skip ci]"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
