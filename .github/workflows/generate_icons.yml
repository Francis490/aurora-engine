name: Generate PWA Icons

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: aurora-write-${{ github.ref }}
  cancel-in-progress: false

jobs:
  generate-icons:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Setup Python 3.10
        uses: actions/setup-python@v6
        with:
          python-version: '3.10'

      - name: Install Pillow
        run: pip install Pillow==10.3.0

      - name: Generate Icons
        run: python generate_icons.py

      - name: Commit and Push Icons
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add icon-192.png icon-512.png
          if git diff --cached --quiet; then
            echo "Nessuna icona nuova."
          else
            git commit -m "Auto-generate PWA icons [skip ci]"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
