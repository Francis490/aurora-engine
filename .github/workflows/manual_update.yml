name: Manual Update

on:
  workflow_dispatch:
    inputs:
      concorso:
        description: 'Numero concorso (es. 112)'
        required: true
        type: string
      data:
        description: 'Data estrazione DD/MM/YYYY (es. 22/09/2026)'
        required: true
        type: string
      numeri:
        description: '8 numeri estratti separati da virgola (es. "23,42,47,60,69,71,87,88")'
        required: true
        type: string
      sestine:
        description: 'Sestine giocate (opzionale) - formato "a,b,c,d,e,f | g,h,i,j,k,l"'
        required: false
        default: ''
        type: string

permissions:
  contents: write

concurrency:
  group: aurora-manual-${{ github.ref }}
  cancel-in-progress: false

jobs:
  manual-update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      MPLBACKEND: Agg
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      MANUAL_CONCORSO: ${{ github.event.inputs.concorso }}
      MANUAL_DATA: ${{ github.event.inputs.data }}
      MANUAL_NUMERI: ${{ github.event.inputs.numeri }}
      MANUAL_SESTINE: ${{ github.event.inputs.sestine }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Setup Python 3.10
        uses: actions/setup-python@v6
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install Dipendenze
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Aggiornamento manuale
        run: python aurora_manual_update.py

      - name: Esecuzione engine + report Telegram
        run: python vinci_vita_telegram.py

      - name: Salvataggio su GitHub
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          for file in vinci_history.json vinci_played.json vinci_database.json vinci_bankroll.json; do
            if [ -f "$file" ]; then
              git add "$file"
            fi
          done

          if git diff --cached --quiet; then
            echo "Nessuna modifica da salvare."
          else
            git commit -m "Manual update: concorso ${{ github.event.inputs.concorso }} [skip ci]"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
