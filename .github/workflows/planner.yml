name: Aurora Planner

on:
  schedule:
    # 20:30 UTC+2 (dopo il sync delle 19:30) — eseguito dopo l'estrazione
    - cron: '30 18 * * *'
  workflow_dispatch:

permissions:
  contents: write

# STESSO GROUP del workflow vinci_sync.yml → serializzazione
concurrency:
  group: aurora-sync-${{ github.ref }}
  cancel-in-progress: false

jobs:
  planner:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.10'
          cache: 'pip'
      - run: pip install -r requirements.txt
      - name: Genera 2 sestine
        run: python vinci_vita_planner.py --n 2
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          for f in vinci_planner.json vinci_database.json vinci_bankroll.json; do
            [ -f "$f" ] && git add "$f" || true
          done
          if git diff --cached --quiet; then
            echo "Nessuna modifica."
          else
            git commit -m "planner: 2 sestine + dashboard [skip ci]"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
