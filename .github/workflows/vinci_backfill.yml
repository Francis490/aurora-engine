name: Aurora Engine — Backfill History

on:
  workflow_dispatch:
    inputs:
      days:
        description: 'Numero di giorni da recuperare (max 60)'
        required: true
        default: '7'
        type: string

permissions:
  contents: write

concurrency:
  group: aurora-backfill-${{ github.ref }}
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      MPLBACKEND: Agg

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Setup Python 3.10
        uses: actions/setup-python@v6
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install Dipendenze
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Backfill History
        run: |
          DAYS="${{ github.event.inputs.days }}"
          # Cap a 60 giorni per sicurezza
          if [ "$DAYS" -gt 60 ]; then
            DAYS=60
          fi
          echo "[*] Recupero ultimi $DAYS giorni"
          python fetch_vinci_draw.py --backfill $DAYS

      - name: Salvataggio su GitHub
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          git add vinci_history.json

          if git diff --cached --quiet; then
            echo "Nessuna modifica."
          else
            STORICO=$(python -c "import json; print(len(json.load(open('vinci_history.json'))))")
            git commit -m "Backfill history: $STORICO estrazioni [skip ci]"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
