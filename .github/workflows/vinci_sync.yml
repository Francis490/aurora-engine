name: Aurora Engine — Daily Sync

on:
  schedule:
    - cron: '30 19 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: aurora-sync-${{ github.ref }}
  cancel-in-progress: false

jobs:
  run-aurora:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      MPLBACKEND: Agg
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Setup Python 3.10
        uses: actions/setup-python@v6
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install Dipendenze
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Fetch estrazione da AGIMEG
        run: python fetch_vinci_draw.py
        continue-on-error: true

      - name: Esecuzione Aurora Engine + Report Telegram
        run: python vinci_vita_telegram.py

      - name: Salvataggio automatico su GitHub
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          for file in vinci_history.json vinci_database.json vinci_played.json vinci_bankroll.json; do
            if [ -f "$file" ]; then
              git add "$file"
            fi
          done

          if git diff --cached --quiet; then
            echo "Nessuna modifica da salvare."
          else
            git commit -m "Aurora sync: $(date +'%Y-%m-%d') [skip ci]"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      - name: Preparazione cartella sito
        run: |
          mkdir -p _site
          cp index.html _site/index.html
          [ -f manifest.json ]  && cp manifest.json _site/manifest.json || true
          [ -f sw.js ]          && cp sw.js _site/sw.js || true
          [ -f icon-192.png ]   && cp icon-192.png _site/icon-192.png || true
          [ -f icon-512.png ]   && cp icon-512.png _site/icon-512.png || true
          [ -f vinci_database.json ] && cp vinci_database.json _site/vinci_database.json || true
          touch _site/.nojekyll

      - name: Upload artifact per GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy-pages:
    needs: run-aurora
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy su GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
